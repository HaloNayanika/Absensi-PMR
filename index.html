<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi PMR</title>
<style>:root{--bg:#f6f3f3;--sf:#fff;--tx:#201a1a;--mu:#7a6f6f;--ac:#c62828;--ac2:#8e1b1b;--bd:#e6dede;--ok:#2e7d32;--no:#b26a00;--sh:0 1px 3px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#141010;--sf:#211a1a;--tx:#f3eded;--mu:#a99d9d;--ac:#ef5350;--ac2:#c62828;--bd:#3a3030;--ok:#66bb6a;--no:#ffb74d;--sh:none}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;gap:8px;flex-wrap:wrap;box-shadow:var(--sh)}
header b{font-size:17px;letter-spacing:.2px}.st{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.22);display:inline-block;min-height:20px}
main{max-width:960px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
nav button,.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;white-space:nowrap;box-shadow:var(--sh)}
nav button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn{margin:4px 4px 4px 0}.btn:active{transform:scale(.97)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}.card h3{margin:0 0 10px}
.logo{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-size:13px}tr:nth-child(even) td{background:rgba(127,127,127,.06)}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--ac);font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(127,127,127,.15)}.badge.ok{background:rgba(46,125,50,.15)}.badge.no{background:rgba(178,106,0,.15);color:var(--no)}
.mt{padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--bg)}.mt.lk{opacity:.55}.mt.act{border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}.stat b{display:block;font-size:24px;color:var(--ac)}.stat span{color:var(--mu);font-size:13px}
.bar{display:inline-block;width:70px;height:8px;border-radius:9px;background:var(--bd);margin-right:8px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.qr{display:inline-block;background:#fff;padding:8px;border-radius:10px;margin:6px;text-align:center;color:#000;font-size:12px;border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.grid img,.grid video{width:100%;height:110px;object-fit:cover;border-radius:10px}
video#cam{width:100%;max-width:360px;border-radius:12px;background:#000}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kartu{background:#fff;color:#000;border:1px solid #bbb;border-radius:12px;padding:10px;text-align:center}.kartu img{width:100%;max-width:130px}.kh{font-weight:800;color:#c62828;letter-spacing:2px}.kn{font-weight:700;font-size:13px}.kx{font-size:11px;color:#555}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:all .25s;z-index:9;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast.bad{background:#b71c1c}
@media print{header,nav,.noprint,#toast,#notes{display:none!important}body{background:#fff}main{padding:0}.cards{grid-template-columns:repeat(3,1fr)}.kartu{break-inside:avoid}}

async function api(path,o={}){const key='c:'+(me?me.id:0)+path;
 try{const j=await call({p:path,m:o.m||'GET',t:tok,b:o.b});
  if(j.s===401&&path!=='/login'){logout();throw Error('Sesi habis, silakan login lagi')}
  if(j.s>=400)throw Error(j.d.err||'Error');off=false;if(!o.m)try{LS[key]=JSON.stringify(j.d)}catch{}netUI();return j.d}
 catch(e){if(e instanceof TypeError){off=true;netUI();if(!o.m&&LS[key])return JSON.parse(LS[key]);throw Error('Sedang offline atau server tidak terjangkau. Fitur ini perlu internet.')}throw e}}
const go=async(f)=>{try{await f()}catch(e){toast(e.message,1)}};
function netUI(){$('net').textContent=(navigator.onLine&&!off)?'\u25CF Online':'\u25CB Offline (data tersimpan)'}

let last='',beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),120)}catch{}};
V.scan=async()=>{const L=await api('/siswa');$('v').innerHTML=`<div class="card"><h3>Scan QR siswa</h3><video id="cam" playsinline muted></video><br><button class="btn p" onclick="startCam()">Buka kamera</button><p class="mu">Kalau kamera live diblokir, foto QR-nya:</p><input type="file" accept="image/\x2A" capture="environment" onchange="scanPhoto(this)"><p id="res" class="mu">Arahkan QR siswa ke kamera.</p></div>
<div class="card"><h3>Absen manual (siswa tanpa HP)</h3><select id="ms">${L.map(s=>`<option value="${esc(s.nisn)}">${esc(s.n)}</option>`).join('')}</select><button class="btn p" onclick="manual()">Hadirkan</button><p id="res2"></p></div>`};
async function sendScan(n,by,el){try{const r=await api('/scan',{m:'POST',b:{nisn:n,by}});el.className=r.ok?'ok':'bad';el.textContent=r.msg;if(r.ok)beep()}catch(e){el.className='bad';el.textContent=e.message}}
function scanPhoto(el){const f=el.files[0];if(!f)return;if(typeof jsQR==='undefined'){$('res').className='bad';$('res').textContent='Pemindai QR belum termuat. Pakai absen manual.';return}const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
 const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r&&r.data)sendScan(r.data,'scan',$('res'));else{$('res').className='bad';$('res').textContent='QR tidak terbaca, coba foto lebih dekat & terang.'}el.value=''};img.src=URL.createObjectURL(f)}
const manual=()=>sendScan($('ms').value,'manual',$('res2'));
async function startCam(){if(typeof jsQR==='undefined'){$('res').textContent='Pemindai QR belum termuat (cek internet lalu muat ulang). Pakai absen manual dulu.';return}if(!navigator.mediaDevices){$('res').textContent='Kamera butuh HTTPS atau localhost. Lihat README.';return}
 try{stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('cam');v.srcObject=stream;await v.play();
 const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
 (function loop(){if(!stream)return;if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
  if(r&&r.data&&r.data!==last){last=r.data;sendScan(r.data,'scan',$('res'));setTimeout(()=>last='',3000)}}requestAnimationFrame(loop)})()}
 catch(e){$('res').textContent='Kamera gagal dibuka ('+e.name+'). Izinkan kamera di browser, atau pakai absen manual.'}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}

 REK={K2,S,by,tot};
 $('v').innerHTML=`<div class="card"><h3>Rekap kehadiran</h3><select onchange="rk=this.value;V.rekap()"><option value="">Ringkasan semua kegiatan</option>${K.map(k=>`<option value="${k.id}" ${String(k.id)===rk?'selected':''}>${k.d} - ${esc(k.name)} (${k.count})</option>`).join('')}</select><button class="btn" onclick="exportRekap()">Ekspor ke Excel</button><div id="exp"></div></div>${det}
 <div class="card"><h3>Per siswa (${tot} kegiatan)</h3><div class="tw"><table><tr><th>Nama</th><th>Hadir</th><th>Persen</th></tr>${per.map(x=>`<tr><td>${esc(x.s.n)}</td><td>${x.h}</td><td><div class="bar"><i style="width:${x.p}%"></i></div>${x.p}%</td></tr>`).join('')}</table></div></div>`};
function exportRekap(){const {K2,S,by,tot}=REK,R=[['No','Nama',...K2.map(k=>k.d+' '+k.name),'Total hadir','Persen']];
 S.forEach((s,i)=>{const c=K2.map(k=>by[k.id]&&by[k.id][s.nisn]?'H':''),h=c.filter(Boolean).length;R.push([i+1,s.n,...c,h,(tot?Math.round(h*100/tot):0)+'%'])});
 REK.csv='\ufeff'+R.map(r=>r.map(x=>'"'+String(x).split('"').join('""')+'"').join(';')).join('\r\n');
 $('exp').innerHTML='<p class="mu">NISN tidak ikut diekspor. Pilih salah satu:</p><button class="btn p" onclick="dlCsv()">Unduh .csv</button> <button class="btn" onclick="copyTsv()">Salin (tempel ke Excel / Sheets)</button><textarea id="tsv" rows="4" readonly></textarea>';
 $('tsv').value=R.map(r=>r.join('\t')).join('\n')}
function dlCsv(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([REK.csv],{type:'text/csv;charset=utf-8'}));a.download='rekap-kehadiran-pmr.csv';document.body.appendChild(a);a.click();a.remove();toast('Mengunduh...')}catch(e){toast('Unduh diblokir, pakai tombol Salin',1)}}
function copyTsv(){const t=$('tsv');t.select();try{document.execCommand('copy');toast('Tersalin. Tempel di Excel / Sheets.')}catch(e){toast('Salin manual dengan Ctrl+C',1)}}

V.cetak=async()=>{const S=await api('/siswa');
 $('v').innerHTML=`<div class="card noprint"><h3>Cetak kartu QR (${S.length} siswa)</h3><p class="mu">Tekan Cetak. Kalau tidak muncul, tekan Ctrl+P. Pilih kertas A4.</p><button class="btn p" onclick="try{window.print()}catch(e){toast('Tekan Ctrl+P',1)}">Cetak</button></div><div class="cards">${S.map(s=>`<div class="kartu"><div class="kh">PMR</div><img src="${qrUrl(s.nisn)}" alt=""><div class="kn">${esc(s.n)}</div><div class="kx">${esc(mask(s.nisn))}</div></div>`).join('')}</div>`};
V.riwayat=async()=>{const A=await api('/att');$('v').innerHTML=`<div class="card"><h3>Riwayat kehadiran</h3><p><span class="badge ok">${A.length}x hadir</span></p><div class="tw"><table>${A.map(x=>`<tr><td>${x.d}</td><td>${esc(x.kn||'Pertemuan')}</td><td>${x.t}</td></tr>`).join('')||'<tr><td class="mu">Belum ada</td></tr>'}</table></div></div>`};
V.ringkas=async()=>{const [S,A,K,M,G]=await Promise.all([api('/siswa'),api('/att'),api('/kas'),api('/materi'),api('/kegiatan')]),sd=K.reduce((a,k)=>a+(k.type==='in'?k.amt:-k.amt),0);
 $('v').innerHTML=`<div class="stats">${stat(S.length,'Anggota')}${stat(A.filter(a=>a.d===todayS()).length,'Hadir hari ini')}${stat(G.length,'Kegiatan')}${stat(rp(sd),'Saldo kas')}${stat(M.filter(m=>!m.lock).length+'/'+M.length,'Materi terbuka')}</div><div class="card"><h3>Kegiatan terakhir</h3>${G.slice(0,5).map(k=>`<div class="mt"><b>${esc(k.name)}</b> <span class="mu">${k.d}</span> <span class="badge ok">${k.count} hadir</span></div>`).join('')||'<p class="mu">Belum ada</p>'}</div>`};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!me&&$('p'))login()});

if(me)draw();else draw();

</script></body></html>
